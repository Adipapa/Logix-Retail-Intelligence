# Render Blueprint for Logix Retail Intelligence
# Deploys the React frontend, FastAPI backend, and managed PostgreSQL database.
services:
  - type: web
    name: logix-retail-api
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    branch: postgres-migration
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: logix-retail-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: logix-retail-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Logix Central Administrator
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_ROOT_PATH
        value: /Logix Retail

  - type: web
    name: logix-retail-frontend
    runtime: static
    branch: postgres-migration
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          name: logix-retail-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: logix-retail-db
    databaseName: logix_retail
    user: logix
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
