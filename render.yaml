# Render Blueprint for Logix Retail Intelligence
# Free Render API + free static frontend. PostgreSQL remains on the existing Neon project.
services:
  - type: web
    name: logix-retail-api
    runtime: python
    plan: free
    region: oregon
    branch: postgres-migration
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://logix-retail-intelligence.onrender.com
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Logix Central Administrator
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_ROOT_PATH
        value: /Logix Retail

  - type: web
    name: Logix-Retail-Intelligence
    runtime: static
    branch: postgres-migration
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          name: logix-retail-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
