[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router / client-side routes: serve the SPA entry point for app paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for Vite-generated, fingerprinted assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
