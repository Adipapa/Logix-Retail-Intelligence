name: Logix Retail CI

on:
  pull_request:
    branches: [main, postgres-migration]
  push:
    branches: [postgres-migration, complete-analytics-upgrade]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used
      DATABASE_URL: sqlite:///./ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/migrations
      - name: Validate Alembic migration graph
        working-directory: backend
        run: alembic heads
      - name: Apply migrations to an isolated SQLite database
        working-directory: backend
        run: alembic upgrade head
      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"
